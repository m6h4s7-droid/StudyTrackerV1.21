
name: Build Study Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/studytracker"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/studytracker"

      - name: Locate Android Project
        id: project
        run: |
          PROJECT=$(find "$RUNNER_TEMP/studytracker" \
            -type f \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Gradle project not found inside ZIP!"
            echo "ZIP structure:"
            find "$RUNNER_TEMP/studytracker" -maxdepth 4 -type f
            exit 1
          fi

          echo "dir=$(dirname "$PROJECT")" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          cd "${{ steps.project.outputs.dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
