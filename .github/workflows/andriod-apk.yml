name: Build Study Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android Project
        id: project
        shell: bash
        run: |
          PROJECT=$(find . -name settings.gradle \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "settings.gradle not found!"
            exit 1
          fi

          echo "dir=$(dirname "$PROJECT")" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.project.outputs.dir }}" \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
